<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><title>Customer Receipt</title><style>body{font-family:Tahoma,monospace;width:72mm;margin:0 auto;padding:6mm;color:#000}h2,p{text-align:center;margin:4px}.line{display:flex;justify-content:space-between;border-bottom:1px dashed #999;padding:6px 0}.total{font-size:20px;font-weight:bold;margin-top:12px}.actions{text-align:center;margin:18px}@media print{.actions{display:none}body{width:auto}}</style></head><body><h2>TRACK BITE</h2><p>تراك بايت</p><div id="content">Loading…</div><div class="actions"><button onclick="window.print()">Print / طباعة</button></div><script>const token=localStorage.getItem('tb_token');const id=new URLSearchParams(location.search).get('order');fetch('/api/orders/'+id,{headers:{Authorization:'Bearer '+token}}).then(r=>r.json()).then(d=>{const o=d.order;document.querySelector('#content').innerHTML=`<p>Order #${o.sequential_no}</p><p>${o.created_at}</p>${o.items.map(x=>`<div class="line"><span>${x.product_name_ar} × ${x.quantity}</span><b>${Number(x.line_total).toFixed(2)}</b></div>`).join('')}<div class="line total"><span>الإجمالي</span><span>${Number(o.total).toFixed(2)} EGP</span></div><p>${o.payments.map(x=>`${x.name_ar}: ${Number(x.amount).toFixed(2)}`).join(' | ')}</p><p>شكراً لزيارتكم ❤️</p>`}).catch(e=>document.querySelector('#content').textContent=e.message)</script></body></html>
