<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><title>Kitchen Tickets</title><style>body{font-family:Tahoma,monospace;margin:10px}.ticket{width:72mm;border:2px solid #000;padding:5mm;margin:0 auto 12mm;page-break-after:always}.ticket h2{text-align:center;font-size:26px}.item{font-size:20px;font-weight:bold;padding:10px 0;border-bottom:1px dashed #000}.modifier,.note{display:block;font-size:14px;margin-top:5px}.actions{text-align:center}.error{max-width:72mm;margin:30px auto;padding:16px;border:1px solid #c00;color:#900}@media print{.actions{display:none}.ticket{border:0;margin:0}}</style></head><body><div id="tickets"></div><div class="actions"><button onclick="window.print()">Print All / طباعة الكل</button></div><script>const token=localStorage.getItem('tb_token');const id=new URLSearchParams(location.search).get('order');fetch('/api/orders/'+id,{headers:{Authorization:'Bearer '+token}}).then(async r=>{const d=await r.json();if(!r.ok)throw new Error(d.error||`Request failed (${r.status})`);if(!d.order?.items)throw new Error('Order not found');return d}).then(d=>{const o=d.order;const groups={};o.items.forEach(x=>{const k=x.station_code||'kitchen';(groups[k]??=[]).push(x)});document.querySelector('#tickets').innerHTML=Object.entries(groups).map(([k,items])=>`<section class="ticket"><h2>#${o.sequential_no}</h2><h3>${items[0].station_name_ar||k}</h3><p>${o.created_at}</p>${items.map(x=>`<div class="item">${x.quantity} × ${x.product_name_ar}${(x.modifiers||[]).length?`<span class="modifier">${x.modifiers.map(m=>`+ ${m.name_ar||m.name_en}`).join('<br>')}</span>`:''}${x.notes?`<span class="note">${x.notes}</span>`:''}</div>`).join('')}</section>`).join('')}).catch(e=>{document.querySelector('#tickets').innerHTML=`<p class="error">${e.message}</p>`;document.querySelector('.actions').hidden=true})</script></body></html>
