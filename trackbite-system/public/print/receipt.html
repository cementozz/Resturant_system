<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Track Bite · Print archive</title><link rel="stylesheet" href="/app/styles.css"><style>body{min-height:100vh;padding:clamp(16px,3vw,36px);background:linear-gradient(135deg,#eef3ef,#f8faf8);color:#14291f}.print-shell{max-width:1180px;margin:auto}.print-header{display:flex;align-items:flex-start;justify-content:space-between;gap:20px;margin-bottom:18px}.print-header h1{margin:4px 0;font-size:clamp(22px,3vw,32px)}.print-kicker{color:#206448;font-size:12px;font-weight:800;letter-spacing:.12em;text-transform:uppercase}.print-actions{display:flex;align-items:center;gap:10px;flex-wrap:wrap}.print-actions button{white-space:nowrap}.print-status{display:inline-flex;align-items:center;gap:7px;padding:9px 12px;border-radius:999px;background:#e4f3e9;color:#17613f;font-size:13px;font-weight:700}.print-status:before{content:"";width:8px;height:8px;border-radius:50%;background:#2d9b65}.print-jobs{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}.print-jobs button.active{background:#206448;color:#fff;border-color:#206448}.print-message{margin:0 0 14px;padding:12px 14px;border:1px solid #dbe6dd;border-radius:10px;background:#fff;color:#536459}.preview-frame{padding:14px;border:1px solid #dbe6dd;border-radius:16px;background:#fff;box-shadow:0 18px 50px #14291f12}iframe{display:block;width:100%;height:min(78vh,900px);border:1px solid #e5ebe6;background:#fff;border-radius:10px}@media(max-width:700px){.print-header{display:block}.print-actions{margin-top:16px}.preview-frame{padding:7px}}
@media print{body{padding:0;background:#fff}.print-header,.print-jobs,.print-message,.print-actions{display:none}.preview-frame{padding:0;border:0;box-shadow:none}.preview-frame iframe{height:100vh;border:0}}
</style></head><body><div class="print-shell"><header class="print-header"><div><span class="print-kicker">Track Bite · Print center</span><h1>${t('أرشيف الطباعة','Print archive')}</h1></div><div class="print-actions"><span class="print-status">${t('جاهز للطباعة','Ready to print')}</span><button id="confirmPrint" hidden>تمت الطباعة / Mark printed</button></div></header><div id="toolbar" class="print-jobs"></div><p id="message" class="print-message"></p><div class="preview-frame"><iframe title="Print preview" id="preview"></iframe></div></div><script type="module">
import {state,$,api,post,safe,t,esc,toast} from '/app/shared.js';
const params=new URLSearchParams(location.search),order=params.get('order');document.querySelector('.print-header h1').textContent=t('أرشيف الطباعة','Print archive');document.querySelector('.print-status').textContent=t('جاهز للطباعة','Ready to print');
async function show(id){const response=await fetch('/api/printing/jobs/'+id+'/preview',{headers:{authorization:'Bearer '+state.token}});if(!response.ok)throw new Error((await response.json()).error);$('#preview').srcdoc=await response.text();$('#confirmPrint').hidden=false;$('#confirmPrint').onclick=async()=>{await post('/api/printing/jobs/'+id+'/confirm');$('#message').textContent=t('تم تسجيل الطباعة','Print confirmed')};$('#message').textContent=t('معاينة محفوظة وقت إصدار المستند. اختر طباعة من داخل المعاينة.','Snapshot saved when this document was issued. Print using the button inside the preview.');}
try{if(params.get('job'))await show(params.get('job'));else{const {rows}=await api('/api/printing/jobs?order='+encodeURIComponent(order));$('#toolbar').innerHTML=rows.map(j=>`<button data-job="${j.id}">${esc(j.job_type)} ${esc(j.station_code||'')} #${j.id} ${j.reprint?'REPRINT':''} · ${esc(j.status)}</button>`).join('');document.querySelectorAll('[data-job]').forEach(b=>b.onclick=()=>show(b.dataset.job).catch(e=>$('#message').textContent=e.message));if(rows.length)await show(rows.find(r=>r.job_type==='customer')?.id||rows[0].id);else $('#message').textContent='No archived print jobs';}}catch(e){$('#message').textContent=e.message}
</script></body></html>
