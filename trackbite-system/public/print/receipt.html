<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Track Bite · Print archive</title><link rel="stylesheet" href="/app/styles.css"><style>body{padding:24px}iframe{display:block;width:100%;height:78vh;border:1px solid #ddd;background:white;margin-top:20px}</style></head><body><div id="toolbar" class="toolbar"></div><button id="confirmPrint" hidden>تمت الطباعة / Mark printed</button><p id="message"></p><iframe title="Print preview" id="preview"></iframe><script type="module">
import {state,$,api,post,safe,t,esc,toast} from '/app/shared.js';
const params=new URLSearchParams(location.search),order=params.get('order');
async function show(id){const response=await fetch('/api/printing/jobs/'+id+'/preview',{headers:{authorization:'Bearer '+state.token}});if(!response.ok)throw new Error((await response.json()).error);$('#preview').srcdoc=await response.text();$('#confirmPrint').hidden=false;$('#confirmPrint').onclick=async()=>{await post('/api/printing/jobs/'+id+'/confirm');$('#message').textContent=t('تم تسجيل الطباعة','Print confirmed')};$('#message').textContent=t('معاينة محفوظة وقت إصدار المستند. اختر طباعة من داخل المعاينة.','Snapshot saved when this document was issued. Print using the button inside the preview.');}
try{if(params.get('job'))await show(params.get('job'));else{const {rows}=await api('/api/printing/jobs?order='+encodeURIComponent(order));$('#toolbar').innerHTML=rows.map(j=>`<button data-job="${j.id}">${esc(j.job_type)} ${esc(j.station_code||'')} #${j.id} ${j.reprint?'REPRINT':''} · ${esc(j.status)}</button>`).join('');document.querySelectorAll('[data-job]').forEach(b=>b.onclick=()=>show(b.dataset.job).catch(e=>$('#message').textContent=e.message));if(rows.length)await show(rows.find(r=>r.job_type==='customer')?.id||rows[0].id);else $('#message').textContent='No archived print jobs';}}catch(e){$('#message').textContent=e.message}
</script></body></html>
