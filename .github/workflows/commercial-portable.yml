name: Build portable commercial package

on:
  push:
    branches:
      - commercial-portable-build
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Build portable package
        shell: powershell
        run: powershell -NoProfile -ExecutionPolicy Bypass -File commercial/build-portable.ps1
      - name: Verify package exists
        shell: powershell
        run: |
          if (!(Test-Path dist-commercial\..\TrackBite-Portable-Commercial.zip)) { throw 'Portable package was not created' }
          Get-FileHash TrackBite-Portable-Commercial.zip -Algorithm SHA256
      - uses: actions/upload-artifact@v4
        with:
          name: TrackBite-Portable-Commercial
          path: TrackBite-Portable-Commercial.zip
          if-no-files-found: error
          retention-days: 30
